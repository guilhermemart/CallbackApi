services:
  callback-api:
    environment:
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env to this VM's public IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - backend

volumes:
  caddy_data:
  caddy_config:
