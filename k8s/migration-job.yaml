apiVersion: batch/v1
kind: Job
metadata:
  name: callbackapi-migrations
  namespace: callbackapi
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: callbackapi-postgres
          command: ["sh", "-c", "until pg_isready -h postgres -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done"]
      containers:
        - name: migrations
          image: callback-api:local
          imagePullPolicy: Never
          args: ["--migrate"]
          envFrom:
            - secretRef:
                name: callbackapi-postgres
